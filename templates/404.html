{% extends "base.html" %}
{% block title %}404 – Page Not Found – SkillBarter{% endblock %}
{% block content %}
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;padding:2rem;gap:1.5rem;">
    <div style="font-size:5rem;">🔍</div>
    <h1 style="font-family:var(--font-display);font-size:clamp(2rem,5vw,3.5rem);">404</h1>
    <h2 style="color:var(--text-muted);font-size:1.2rem;font-weight:400;">Oops — this page doesn't exist.</h2>
    <p style="color:var(--text-dim);max-width:400px;">The page you're looking for may have moved or been deleted.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg">← Back to Home</a>
</div>
{% endblock %}
